<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Online</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 600;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            border-color: #25D366;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        .btn-submit {
            width: 100%;
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background-color: #1ebc57;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Form Absensi</h2>
        <form id="absensiForm">
            <!-- Input Nama -->
            <div class="form-group">
                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" placeholder="Masukkan nama Anda" required>
            </div>

            <!-- Status Kehadiran -->
            <div class="form-group">
                <label for="status">Status Kehadiran:</label>
                <select id="status" onchange="toggleKeterangan()" required>
                    <option value="">-- Pilih Status --</option>
                    <option value="Hadir">Hadir</option>
                    <option value="Izin">Izin</option>
                    <option value="Sakit">Sakit</option>
                    <option value="Tidak Hadir (Alpa)">Tidak Hadir (Alpa)</option>
                </select>
            </div>

            <!-- Keterangan Tambahan -->
            <div class="form-group" id="groupKeterangan">
                <label for="keterangan">Keterangan / Alasan:</label>
                <textarea id="keterangan" placeholder="Berikan alasan jika Sakit/Izin/Alpa..."></textarea>
            </div>

            <!-- Tombol Kirim -->
            <button type="button" class="btn-submit" onclick="kirimKeWA()">
                Kirim Absen via WhatsApp
            </button>
        </form>
    </div>

    <script>
        // --- UBAH NOMOR DI SINI ---
        // Ganti nomor di bawah ini dengan nomor WA tujuan (Gunakan kode 62)
        const nomorWAAdmin = "6285167728103"; 

        function toggleKeterangan() {
            const status = document.getElementById("status").value;
            const keteranganBox = document.getElementById("keterangan");
            
            if (status === "Hadir") {
                keteranganBox.placeholder = "Catatan tambahan (opsional)...";
            } else {
                keteranganBox.placeholder = "Wajib isi alasan ketidakhadiran...";
            }
        }

        function kirimKeWA() {
            const nama = document.getElementById("nama").value.trim();
            const status = document.getElementById("status").value;
            const keterangan = document.getElementById("keterangan").value.trim() || "-";

            if (nama === "" || status === "") {
                alert("Harap isi Nama dan Status Kehadiran!");
                return;
            }

            const sekarang = new Date();
            const opsiTanggal = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const tanggalFormatted = sekarang.toLocaleDateString('id-ID', opsiTanggal);
            const jamFormatted = sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            let pesan = `*--- LAPORAN ABSENSI ---*\n\n`;
            pesan += `🗓 *Hari/Tanggal:* ${tanggalFormatted}\n`;
            pesan += `⏰ *Waktu:* ${jamFormatted} WIB\n\n`;
            pesan += `👤 *Nama:* ${nama}\n`;
            pesan += `📌 *Status:* *${status.toUpperCase()}*\n`;
            pesan += `📝 *Keterangan:* ${keterangan}\n\n`;
            pesan += `_Pesan ini dikirim secara otomatis melalui Form Absensi Online._`;

            const pesanEncoded = encodeURIComponent(pesan);
            const urlWA = `https://wa.me/${nomorWAAdmin}?text=${pesanEncoded}`;

            window.open(urlWA, '_blank');
        }
    </script>
</body>
</html>
